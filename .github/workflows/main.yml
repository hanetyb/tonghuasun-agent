name: Auto Sync Fork

on:
  schedule:
    - cron: '0 0 * * 1' # 每周一 UTC 时间 0:00（即北京时间周一早上 8:00）执行一次
  workflow_dispatch: # 允许你在 GitHub 网页端手动点击按钮触发同步

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予工作流修改和推送代码的权限
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 【注意】请将下面链接中的 主项目作者/主项目仓库名 替换为真正的源项目地址
          git remote add upstream https://github.com/主项目作者/主项目仓库名.git
          git fetch upstream
          
          git checkout main
          git merge upstream/main --allow-unrelated-histories || exit 1
          git push origin main
